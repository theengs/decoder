name: Create and publish documentation
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  documentation:
    runs-on: ubuntu-latest
    name: Create the documentation and deploy it to GitHub Pages
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas markdown pytablereader tabulate
          npm install
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61
          actions-cache-folder: emsdk-cache
      - name: Build browser WebAssembly decoder
        run: npm run build:web
        working-directory: nodejs/theengs-decoder
      - name: Build documentation
        run: |
          npm run docs:build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./generated/site
          cname: decoder.theengs.io
